name: CI Motor Python

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test y análisis de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install --quiet ".[dev]"

      - name: Pytest
        run: pytest tests/ -v

      - name: Bandit (análisis de seguridad)
        run: bandit -c bandit.yml -r app/
