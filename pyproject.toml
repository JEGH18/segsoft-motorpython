[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdgseg-engine"
version = "0.1.0"
description = "PDG SegSoft - Motor de análisis de cumplimiento"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "tree-sitter>=0.22.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "tenacity>=8.3.0",
    "pip-audit>=2.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "bandit>=1.7.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "fixtures"]
severity = "HIGH"
confidence = "MEDIUM"

[tool.hatch.build.targets.wheel]
packages = ["app"]
